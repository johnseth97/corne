on:
    push:
        branches: [main]
        tags: ["v*"]
    workflow_dispatch:

jobs:
    build:
        uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0

    semver:
        name: Semantic Release
        needs: build
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        outputs:
            version: ${{ steps.semantic.outputs.new_release_version }}
        steps:
            - uses: actions/checkout@v4

            - name: Run semantic-release
              id: semantic
              uses: cycjimmy/semantic-release-action@v4
              with:
                  branches: main
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Releases come from either semantic-release (conventional commit on main)
    # or a manually pushed v* tag. Skip when neither produced a tag.
    release:
        name: Upload firmware to GitHub Release
        needs: [build, semver]
        runs-on: ubuntu-latest
        if: >-
            always() && needs.build.result == 'success' &&
            (startsWith(github.ref, 'refs/tags/v') || needs.semver.outputs.version != '')
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: firmware
                  path: firmware

            - name: Upload firmware to GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.semver.outputs.version) }}
                  files: firmware/**/*.uf2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
